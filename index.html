#pl{position:fixed;inset:0;background:#050a1c;z-index:50;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

#pl.full{padding:0}

#pl.full #perr{position:absolute;top:56px;left:0;right:0;z-index:4;background:transparent;text-align:center;pointer-events:none}

<script>
const API = "https://xp.m737217130.workers.dev";
const $ = function (s) { return document.querySelector(s); };

let cfg = null;
let type = "live";
let allCats = [];
let cats = [];
let sportMode = false;
let items = [];
let curCat = null;
let player = null;
let backFn = null;
let cur = null;
let retries = 0;
let retryTimer = null;
let watchTimer = null;
let lastT = -1;
let lastChange = 0;
let dragging = false;
let full = false;
let usedApi = false;
let uiTimer = null;
let hudTimer = null;
let bright = 1;
let lastTap = 0;
let tapTimer = null;
let g = null;
let allCache = {};
let searchSeq = 0;
let searchTimer = null;
let searchMode = false;
const v = $("#v");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function b64(s) {
  const bin = unescape(encodeURIComponent(s));
  return btoa(bin).split("+").join("-").split("/").join("_").split("=").join("");
}
function ctxId() {
  return b64(cfg.server + "|" + cfg.user + "|" + cfg.pass);
}
function imgp(u) {
  if (!u) return "";
  const s = String(u);
  if (s.indexOf("http") !== 0) return "";
  return API + "/i/" + b64(s);
}

// ---------- direct links (for VLC) ----------
function baseServer() {
  let s = String(cfg.server || "").trim();
  if (s.indexOf("http") !== 0) s = "http://" + s;
  const a = s.indexOf("/player_api.php");
  if (a > -1) s = s.slice(0, a);
  const b = s.indexOf("/get.php");
  if (b > -1) s = s.slice(0, b);
  while (s.length > 0 && s.charAt(s.length - 1) === "/") s = s.slice(0, s.length - 1);
  return s;
}
function directUrl(kind, id, ext) {
  return baseServer() + "/" + kind + "/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.pass) + "/" + id + "." + ext;
}

// ---------- filters ----------
const ADULT_SUBSTR = ["XXX", "PORN", "ADULT", "EROTIC", "EROTIK", "ERWACHSENE", "NSFW", "18+", "+18", "PLAYBOY", "HUSTLER", "BRAZZERS", "سكس", "اباحي", "إباحي", "للكبار", "جنس"];
const ADULT_TOKENS = ["SEX", "SEXY", "ADULTS", "PORNO", "XXX"];
const ARABIC_TOKENS = ["AR", "ARAB", "ARABIC", "ARABE", "ARABIA"];
const SPORT_WORDS = ["SPORT", "SPORTS", "BEIN", "SSC", "ESPN", "DAZN", "FOOTBALL", "SOCCER", "NBA", "UFC", "رياض", "كورة", "كرة", "مباريات", "بي ان", "بين سبورت"];

function tokensOf(s) {
  const out = [];
  let c2 = "";
  const str = String(s || "").toUpperCase();
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    const ok = (c >= 48 && c <= 57) || (c >= 65 && c <= 90);
    if (ok) c2 += str.charAt(i);
    else if (c2) { out.push(c2); c2 = ""; }
  }
  if (c2) out.push(c2);
  return out;
}
function hasArabic(s) {
  const str = String(s || "");
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if ((c >= 0x0600 && c <= 0x06ff) || (c >= 0x0750 && c <= 0x077f) || (c >= 0xfb50 && c <= 0xfdff) || (c >= 0xfe70 && c <= 0xfeff)) return true;
  }
  return false;
}
function isAdult(s) {
  const raw = String(s || "");
  const up = raw.toUpperCase();
  for (let i = 0; i < ADULT_SUBSTR.length; i++) {
    if (up.includes(ADULT_SUBSTR[i]) || raw.includes(ADULT_SUBSTR[i])) return true;
  }
  const t = tokensOf(raw);
  for (let j = 0; j < t.length; j++) if (ADULT_TOKENS.indexOf(t[j]) > -1) return true;
  return false;
}
function isArabic(s) {
  if (hasArabic(s)) return true;
  const t = tokensOf(s);
  for (let j = 0; j < t.length; j++) if (ARABIC_TOKENS.indexOf(t[j]) > -1) return true;
  return false;
}
function isSport(s) {
  const raw = String(s || "");
  const up = raw.toUpperCase();
  for (let i = 0; i < SPORT_WORDS.length; i++) {
    if (up.includes(SPORT_WORDS[i]) || raw.includes(SPORT_WORDS[i])) return true;
  }
  return false;
}

// ---------- text normalize for search ----------
function normText(s) {
  const t = String(s || "").toLowerCase();
  let out = "";
  for (let i = 0; i < t.length; i++) {
    let ch = t.charAt(i);
    const code = t.charCodeAt(i);
    if (code >= 0x064b && code <= 0x065f) continue;
    if (code === 0x0640) continue;
    if (ch === "أ" || ch === "إ" || ch === "آ" || ch === "ٱ") ch = "ا";
    else if (ch === "ى") ch = "ي";
    else if (ch === "ة") ch = "ه";
    out += ch;
  }
  return out;
}

// ---------- api ----------
async function call(params) {
  const u = new URL(API + "/api");
  u.searchParams.set("server", cfg.server);
  u.searchParams.set("username", cfg.user);
  u.searchParams.set("password", cfg.pass);
  Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
  const r = await fetch(u.toString());
  const j = await r.json();
  if (j && j.error && !j.user_info) throw new Error(j.error);
  return j;
}

// ---------- saved accounts ----------
function getSaved() {
  try {
    const a = JSON.parse(localStorage.getItem("sx_saved") || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}
function putSaved(a) {
  localStorage.setItem("sx_saved", JSON.stringify(a));
}
function hostOf(p) {
  try {
    let s = String(p);
    if (s.indexOf("http") !== 0) s = "http://" + s;
    return new URL(s).host;
  } catch (e) { return String(p); }
}
function sameAcc(a, b) {
  return a.server === b.server && a.user === b.user;
}
function saveEntry(acc) {
  const a = getSaved().filter(function (x) { return !sameAcc(x, acc); });
  a.unshift(acc);
  putSaved(a.slice(0, 40));
}
function renderSaved() {
  const box = $("#savedBox");
  box.innerHTML = "";
  const a = getSaved();
  if (!a.length) return;
  box.appendChild(el("h3", "", "الحسابات المحفوظة (اتصلت بنجاح)"));
  a.forEach(function (x) {
    const row = el("div", "sv");
    const label = (x.name ? x.name + "  |  " : "") + hostOf(x.server) + "  |  " + x.user;
    const pick = el("button", "pick", label);
    pick.onclick = function () {
      $("#nm").value = x.name || "";
      $("#srv").value = x.server;
      $("#usr").value = x.user;
      $("#pwd").value = x.pass;
    };
    const del = el("button", "del", "حذف");
    del.onclick = function () {
      putSaved(getSaved().filter(function (y) { return !sameAcc(y, x); }));
      renderSaved();
    };
    row.appendChild(pick);
    row.appendChild(del);
    box.appendChild(row);
  });
}

// ---------- login ----------
function loadLast() {
  try {
    const s = JSON.parse(localStorage.getItem("sx_last") || "null");
    if (s) {
      $("#nm").value = s.name || "";
      $("#srv").value = s.server || "";
      $("#usr").value = s.user || "";
      $("#pwd").value = s.pass || "";
      $("#fAr").checked = s.ar !== false;
      $("#fAd").checked = s.ad !== false;
    }
  } catch (e) {}
  renderSaved();
}

function fmtDate(sec) {
  const n = parseInt(sec, 10);
  if (!n || isNaN(n)) return "-";
  const d = new Date(n * 1000);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

$("#go").onclick = async function () {
  $("#lerr").textContent = "";
  const server = $("#srv").value.trim();
  const user = $("#usr").value.trim();
  const pass = $("#pwd").value;
  if (!server || !user || !pass) { $("#lerr").textContent = "أدخل السيرفر واليوزر والباسورد"; return; }
  cfg = { name: $("#nm").value.trim(), server: server, user: user, pass: pass, ar: $("#fAr").checked, ad: $("#fAd").checked };
  allCache = {};
  searchMode = false;
  searchSeq++;
  $("#q").value = "";
  $("#go").textContent = "جاري الاتصال...";
  try {
    const info = await call({});
    const ui = info && info.user_info;
    if (!ui || String(ui.auth) !== "1") {
      throw new Error("الحساب غير صالح أو اليوزر والباسورد غير صحيحين");
    }
    localStorage.setItem("sx_last", JSON.stringify(cfg));
    saveEntry({ name: cfg.name, server: server, user: user, pass: pass });
    $("#sSt").textContent = String(ui.status || "-");
    $("#sExp").textContent = fmtDate(ui.exp_date);
    $("#sCon").textContent = String(ui.active_cons || 0) + " / " + String(ui.max_connections || "-");
    $("#login").classList.add("hide");
    $("#app").classList.remove("hide");
    loadCats();
  } catch (e) {
    $("#lerr").textContent = "تعذر الاتصال: " + e.message;
  }
  $("#go").textContent = "اتصال";
};

$("#out").onclick = function () {
  closePlayer();
  renderSaved();
  $("#app").classList.add("hide");
  $("#login").classList.remove("hide");
};

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("on", x === b); });
    type = b.dataset.t;
    sportMode = false;
    searchMode = false;
    searchSeq++;
    $("#q").value = "";
    loadCats();
  };
});

// ---------- categories and items ----------
function applyCatFilter() {
  let list = allCats.slice();
  if (cfg.ad) list = list.filter(function (c) { return !isAdult(c.name); });
  if (sportMode) {
    list = list.filter(function (c) { return isSport(c.name); });
  } else if (cfg.ar) {
    list = list.filter(function (c) { return isArabic(c.name); });
  }
  cats = list;
}

function catAction() {
  if (type === "live") return "get_live_categories";
  if (type === "vod") return "get_vod_categories";
  return "get_series_categories";
}
function itemAction() {
  if (type === "live") return "get_live_streams";
  if (type === "vod") return "get_vod_streams";
  return "get_series";
}

function emptyText() {
  return sportMode ? "لا توجد أقسام رياضة في هذا الحساب" : "لا توجد أقسام (جرّب إيقاف فلتر العربي أو ابحث بالاسم)";
}

async function loadCats() {
  backFn = null;
  searchMode = false;
  $("#cats").innerHTML = "";
  $("#grid").innerHTML = "";
  $("#grid").appendChild(el("div", "msg", "جاري التحميل..."));
  try {
    const raw = await call({ action: catAction() });
    allCats = (Array.isArray(raw) ? raw : []).map(function (c) {
      return { id: String(c.category_id), name: String(c.category_name || ("قسم " + c.category_id)) };
    });
    applyCatFilter();
    renderCats();
    if (!cats.length) {
      $("#grid").innerHTML = "";
      $("#grid").appendChild(el("div", "msg", emptyText()));
      return;
    }
    loadItems(cats[0].id);
  } catch (e) {
    $("#grid").innerHTML = "";
    $("#grid").appendChild(el("div", "msg", "تعذر التحميل: " + e.message));
  }
}

function renderCats() {
  const box = $("#cats");
  box.innerHTML = "";
  const sb = el("button", "cat sp" + (sportMode ? " on" : ""), "رياضة");
  sb.onclick = function () {
    sportMode = !sportMode;
    searchMode = false;
    searchSeq++;
    $("#q").value = "";
    applyCatFilter();
    renderCats();
    if (!cats.length) {
      $("#grid").innerHTML = "";
      $("#grid").appendChild(el("div", "msg", emptyText()));
      return;
    }
    loadItems(cats[0].id);
  };
  box.appendChild(sb);
  cats.forEach(function (c) {
    const b = el("button", "cat" + (c.id === curCat && !searchMode ? " on" : ""), c.name);
    b.onclick = function () {
      searchSeq++;
      $("#q").value = "";
      loadItems(c.id);
    };
    box.appendChild(b);
  });
}

function normItem(x) {
  const cat = String(x.category_id === undefined || x.category_id === null ? "" : x.category_id);
  if (type === "live") {
    return { id: String(x.stream_id), name: String(x.name || ""), logo: imgp(x.stream_icon), ext: "ts", cat: cat };
  }
  if (type === "vod") {
    return { id: String(x.stream_id), name: String(x.name || ""), logo: imgp(x.stream_icon), ext: String(x.container_extension || "mp4"), cat: cat };
  }
  return { id: String(x.series_id), name: String(x.name || ""), logo: imgp(x.cover), ext: "mkv", cat: cat };
}

async function loadItems(id) {
  curCat = id;
  backFn = null;
  searchMode = false;
  renderCats();
  const grid = $("#grid");
  grid.innerHTML = "";
  grid.appendChild(el("div", "msg", "جاري التحميل..."));
  try {
    const raw = await call({ action: itemAction(), category_id: id });
    let list = (Array.isArray(raw) ? raw : []).map(normItem);
    if (cfg.ad) list = list.filter(function (x) { return !isAdult(x.name); });
    items = list;
    drawItems();
  } catch (e) {
    grid.innerHTML = "";
    grid.appendChild(el("div", "msg", "تعذر التحميل: " + e.message));
  }
}

function drawList(list, head) {
  const grid = $("#grid");
  grid.innerHTML = "";
  if (head) grid.appendChild(el("div", "msg cnt", head));
  if (!list.length) { grid.appendChild(el("div", "msg", "لا توجد نتائج")); return; }
  list.forEach(function (it) {
    const b = el("button", "card" + (type === "live" ? " live" : ""));
    const ph = el("div", "ph");
    if (it.logo) {
      const im = document.createElement("img");
      im.loading = "lazy";
      im.src = it.logo;
      im.onerror = function () { im.style.visibility = "hidden"; };
      ph.appendChild(im);
    }
    b.appendChild(ph);
    b.appendChild(el("p", "", it.name));
    b.onclick = function () { openItem(it); };
    grid.appendChild(b);
  });
}

function drawItems() {
  const q = normText($("#q").value.trim());
  const list = items.filter(function (x) { return !q || normText(x.name).indexOf(q) > -1; });
  drawList(list, "");
}

// ---------- global search (all categories) ----------
async function loadAllItems() {
  if (allCache[type]) return allCache[type];
  let raw = null;
  try { raw = await call({ action: itemAction() }); } catch (e) { raw = null; }
  let list = [];
  if (Array.isArray(raw) && raw.length) {
    list = raw.map(normItem);
  } else {
    const ids = allCats.map(function (c) { return c.id; });
    for (let i = 0; i < ids.length; i += 4) {
      const part = await Promise.all(ids.slice(i, i + 4).map(function (id) {
        return call({ action: itemAction(), category_id: id }).catch(function () { return []; });
      }));
      part.forEach(function (r) {
        if (Array.isArray(r)) list = list.concat(r.map(normItem));
      });
    }
  }
  list.forEach(function (it) { it.n = normText(it.name); });
  allCache[type] = list;
  return list;
}

async function runSearch(q) {
  const seq = ++searchSeq;
  searchMode = true;
  backFn = null;
  renderCats();
  const grid = $("#grid");
  grid.innerHTML = "";
  grid.appendChild(el("div", "msg", "جاري البحث في كل الأقسام..."));
  let all = [];
  try {
    all = await loadAllItems();
  } catch (e) {
    if (seq !== searchSeq) return;
    grid.innerHTML = "";
    grid.appendChild(el("div", "msg", "تعذر البحث: " + e.message));
    return;
  }
  if (seq !== searchSeq) return;
  const words = normText(q).split(" ").filter(function (w) { return w.length > 0; });
  const adultCats = {};
  if (cfg.ad) {
    allCats.forEach(function (c) { if (isAdult(c.name)) adultCats[c.id] = true; });
  }
  const res = [];
  let capped = false;
  for (let i = 0; i < all.length; i++) {
    const it = all[i];
    let ok = true;
    for (let j = 0; j < words.length; j++) {
      if (it.n.indexOf(words[j]) < 0) { ok = false; break; }
    }
    if (!ok) continue;
    if (cfg.ad && (adultCats[it.cat] || isAdult(it.name))) continue;
    res.push(it);
    if (res.length >= 300) { capped = true; break; }
  }
  const head = "نتائج البحث: " + res.length + (capped ? " (أول 300)" : "");
  drawList(res, head);
}

function onSearch() {
  const q = $("#q").value.trim();
  if (q.length >= 2) {
    runSearch(q);
    return;
  }
  searchSeq++;
  if (searchMode) {
    searchMode = false;
    if (curCat) { loadItems(curCat); return; }
    $("#grid").innerHTML = "";
    return;
  }
  if (backFn) return;
  drawItems();
}

$("#q").addEventListener("input", function () {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(onSearch, 300);
});

// ---------- open ----------
function streamUrl(kind, id, ext) {
  return API + "/s/" + ctxId() + "/" + kind + "/" + id + "." + ext;
}

function openItem(it) {
  if (type === "live") {
    const canTs = window.mpegts && mpegts.isSupported();
    play(streamUrl("live", it.id, canTs ? "ts" : "m3u8"), it.name, "live", directUrl("live", it.id, "m3u8"));
  } else if (type === "vod") {
    play(streamUrl("movie", it.id, it.ext), it.name, "vod", directUrl("movie", it.id, it.ext));
  } else {
    openSeries(it);
  }
}

async function openSeries(it) {
  const grid = $("#grid");
  grid.innerHTML = "";
  grid.appendChild(el("div", "msg", "جاري التحميل..."));
  try {
    const info = await call({ action: "get_series_info", series_id: it.id });
    const eps = (info && info.episodes) || {};
    let seasons = [];
    if (Array.isArray(eps)) {
      seasons = [{ name: "الحلقات", list: eps }];
    } else {
      Object.keys(eps).forEach(function (k) {
        seasons.push({ name: "الموسم " + k, list: eps[k] || [] });
      });
    }
    const wasSearch = searchMode;
    const q = $("#q").value.trim();
    backFn = function () {
      backFn = null;
      if (wasSearch && q.length >= 2) runSearch(q);
      else drawItems();
    };
    showSeasons(it, seasons, wasSearch, q);
  } catch (e) {
    grid.innerHTML = "";
    grid.appendChild(el("div", "msg", "تعذر التحميل: " + e.message));
  }
}

function showSeasons(it, seasons, wasSearch, q) {
  const grid = $("#grid");
  grid.innerHTML = "";
  if (!seasons.length) { grid.appendChild(el("div", "msg", "لا توجد مواسم")); return; }
  if (seasons.length === 1) { showEpisodes(it, seasons[0]); return; }
  const toList = function () {
    backFn = null;
    if (wasSearch && q.length >= 2) runSearch(q);
    else drawItems();
  };
  seasons.forEach(function (s) {
    const b = el("button", "card");
    b.appendChild(el("p", "", s.name));
    b.onclick = function () {
      backFn = function () { showSeasons(it, seasons, wasSearch, q); backFn = toList; };
      showEpisodes(it, s);
    };
    grid.appendChild(b);
  });
}

function showEpisodes(it, s) {
  const grid = $("#grid");
  grid.innerHTML = "";
  s.list.forEach(function (ep) {
    const b = el("button", "card");
    const title = ep.title || ("حلقة " + ep.episode_num);
    b.appendChild(el("p", "", s.name + " - " + title));
    b.onclick = function () {
      const ext = ep.container_extension || "mkv";
      play(streamUrl("series", ep.id, ext), it.name + " - " + s.name + " - " + title, "series", directUrl("series", ep.id, ext));
    };
    grid.appendChild(b);
  });
}

$("#back").onclick = function () {
  if (backFn) { backFn(); return; }
  if (searchMode) {
    searchSeq++;
    searchMode = false;
    $("#q").value = "";
  }
  if (curCat) loadItems(curCat);
};

// ---------- player ----------
function fmt(t) {
  if (!isFinite(t) || t < 0) return "0:00";
  const s = Math.floor(t % 60);
  const m = Math.floor(t / 60) % 60;
  const h = Math.floor(t / 3600);
  const ss = (s < 10 ? "0" : "") + s;
  if (h > 0) return h + ":" + (m < 10 ? "0" : "") + m + ":" + ss;
  return m + ":" + ss;
}

function killPlayer() {
  if (player) { try { player.destroy(); } catch (e) {} player = null; }
  v.pause();
  v.removeAttribute("src");
  v.load();
}

function stopTimers() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
}

function closePlayer() {
  stopTimers();
  cur = null;
  killPlayer();
  setFull(false);
  $("#pl").classList.remove("on");
}

function startStream() {
  if (!cur) return;
  killPlayer();
  const u = cur.url + "?t=" + Date.now();
  const isTs = cur.url.slice(-3) === ".ts";
  const isMp4 = cur.url.slice(-4) === ".mp4";
  const useMpegts = window.mpegts && mpegts.isSupported() && (cur.kind === "live" ? isTs : cur.kind === "vod" && !isMp4);
  if (!useMpegts) {
    v.src = u;
    const p0 = v.play();
    if (p0 && p0.catch) p0.catch(function () {});
    return;
  }
  const live = cur.kind === "live";
  player = mpegts.createPlayer(
    { type: "mpegts", isLive: live, url: u },
    {
      enableWorker: true,
      enableStashBuffer: true,
      stashInitialSize: 2048,
      liveBufferLatencyChasing: false,
      lazyLoad: false,
      autoCleanupSourceBuffer: true,
    }
  );
  player.attachMediaElement(v);
  player.on(mpegts.Events.ERROR, function (t, d) {
    $("#perr").textContent = "انقطع البث (" + d + ")";
    scheduleRetry();
  });
  player.load();
  const p = player.play();
  if (p && p.catch) p.catch(function () {});
}

function scheduleRetry() {
  if (!cur || !cur.auto) return;
  if (retryTimer) return;
  if (retries >= 40) {
    $("#perr").textContent = "توقف البث بعد محاولات كثيرة. جرّب قناة أخرى.";
    return;
  }
  retries++;
  $("#perr").textContent = "إعادة الاتصال... محاولة " + retries;
  retryTimer = setTimeout(function () {
    retryTimer = null;
    lastChange = Date.now();
    startStream();
  }, 1500);
}

function watchdog() {
  if (!cur || !cur.auto) return;
  if (v.paused) { lastChange = Date.now(); return; }
  const t = v.currentTime;
  if (t !== lastT) {
    lastT = t;
    lastChange = Date.now();
    if (retries > 0 && $("#perr").textContent.indexOf("إعادة") === 0) $("#perr").textContent = "";
    return;
  }
  if (Date.now() - lastChange > 10000) {
    lastChange = Date.now();
    scheduleRetry();
  }
}

function play(url, title, kind, direct) {
  stopTimers();
  cur = { url: url, kind: kind, auto: kind === "live", direct: direct || "", title: title };
  retries = 0;
  lastT = -1;
  lastChange = Date.now();
  $("#pt").textContent = title;
  $("#perr").textContent = "";
  const isLive = kind === "live";
  $("#seek").classList.toggle("hide", isLive);
  $("#bk").classList.toggle("hide", isLive);
  $("#fw").classList.toggle("hide", isLive);
  $("#pl").classList.add("on");
  startStream();
  if (cur.auto) watchTimer = setInterval(watchdog, 2000);
  upd();
}

function upd() {
  if (!cur) return;
  const live = cur.kind === "live";
  const d = v.duration;
  const hasDur = !live && isFinite(d) && d > 0;
  $("#seek").disabled = !hasDur;
  if (hasDur) {
    if (!dragging) $("#seek").value = String(Math.floor((v.currentTime / d) * 1000));
    $("#tm").textContent = fmt(v.currentTime) + " / " + fmt(d);
  } else {
    $("#tm").textContent = live ? "مباشر" : fmt(v.currentTime);
  }
  $("#pp").textContent = v.paused ? "▶" : "❚❚";
  $("#mu").textContent = v.muted ? "تشغيل الصوت" : "كتم";
}

v.addEventListener("timeupdate", upd);
v.addEventListener("play", upd);
v.addEventListener("pause", upd);
v.addEventListener("durationchange", upd);
v.addEventListener("volumechange", upd);

v.onerror = function () {
  if (cur && cur.kind !== "live") $("#perr").textContent = "تعذر تشغيل هذا الملف في المتصفح. جرّب زر VLC";
};

$("#pp").onclick = function () {
  if (cur && !player && !v.getAttribute("src")) {
    play(cur.url, cur.title, cur.kind, cur.direct);
    return;
  }
  if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(function () {}); }
  else v.pause();
};

function jump(sec) {
  if (!cur || cur.kind === "live") return;
  let t = v.currentTime + sec;
  if (t < 0) t = 0;
  if (isFinite(v.duration) && v.duration > 0 && t > v.duration) t = v.duration - 1;
  try { v.currentTime = t; } catch (e) {}
}
$("#bk").onclick = function () { jump(-10); };
$("#fw").onclick = function () { jump(10); };

$("#seek").addEventListener("input", function () { dragging = true; });
$("#seek").addEventListener("change", function () {
  const d = v.duration;
  if (isFinite(d) && d > 0) {
    try { v.currentTime = (parseInt($("#seek").value, 10) / 1000) * d; } catch (e) {}
  }
  dragging = false;
});

$("#mu").onclick = function () { v.muted = !v.muted; };
$("#vol").addEventListener("input", function () {
  v.volume = parseInt($("#vol").value, 10) / 100;
  if (v.volume > 0) v.muted = false;
});

$("#au").onclick = function () {
  const at = v.audioTracks;
  if (!at || at.length < 2) {
    $("#perr").textContent = "لا توجد مسارات صوت أخرى في هذا البث";
    return;
  }
  let idx = 0;
  for (let i = 0; i < at.length; i++) if (at[i].enabled) idx = i;
  const nx = (idx + 1) % at.length;
  for (let j = 0; j < at.length; j++) at[j].enabled = j === nx;
  $("#perr").textContent = "مسار الصوت: " + (at[nx].label || at[nx].language || String(nx + 1));
};

// ---------- full page, volume and brightness gestures ----------
function hud(text) {
  const h = $("#hud");
  h.textContent = text;
  h.classList.add("on");
  if (hudTimer) clearTimeout(hudTimer);
  hudTimer = setTimeout(function () { h.classList.remove("on"); }, 1200);
}

function showUi() {
  const p = $("#pl");
  p.classList.add("ui");
  if (uiTimer) clearTimeout(uiTimer);
  uiTimer = setTimeout(function () { p.classList.remove("ui"); }, 3500);
}
function hideUi() {
  if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; }
  $("#pl").classList.remove("ui");
}
function toggleUi() {
  if ($("#pl").classList.contains("ui")) hideUi();
  else showUi();
}

function setFull(on) {
  if (on === full) return;
  full = on;
  const p = $("#pl");
  p.classList.toggle("full", on);
  hideUi();
  if (on) {
    if (p.requestFullscreen) {
      usedApi = true;
      const r = p.requestFullscreen();
      if (r && r.catch) r.catch(function () { usedApi = false; });
    }
    hud("نقرتان للرجوع");
  } else if (usedApi) {
    usedApi = false;
    if (document.fullscreenElement && document.exitFullscreen) {
      try { document.exitFullscreen(); } catch (e) {}
    }
  }
}
function toggleFull() {
  setFull(!full);
}

document.addEventListener("fullscreenchange", function () {
  if (!document.fullscreenElement && usedApi) {
    usedApi = false;
    if (full) {
      full = false;
      $("#pl").classList.remove("full");
      hideUi();
    }
  }
});

function setVol(x) {
  if (x < 0) x = 0;
  if (x > 1) x = 1;
  if (x > 0) v.muted = false;
  v.volume = x;
  if (Math.abs(v.volume - x) > 0.02) {
    hud("الصوت يُضبط من أزرار الجهاز");
    return;
  }
  $("#vol").value = String(Math.round(x * 100));
  hud("الصوت " + Math.round(x * 100) + "%");
}

function setBright(x) {
  if (x < 0.2) x = 0.2;
  if (x > 2) x = 2;
  bright = x;
  v.style.filter = "brightness(" + x + ")";
  hud("الإضاءة " + Math.round(x * 100) + "%");
}

function tap() {
  const now = Date.now();
  if (now - lastTap < 320) {
    lastTap = 0;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    toggleFull();
    return;
  }
  lastTap = now;
  tapTimer = setTimeout(function () {
    tapTimer = null;
    lastTap = 0;
    if (full) toggleUi();
  }, 330);
}

const gest = $("#gest");
gest.addEventListener("pointerdown", function (e) {
  const r = gest.getBoundingClientRect();
  g = {
    x: e.clientX,
    y: e.clientY,
    t: Date.now(),
    side: (e.clientX - r.left) > r.width / 2 ? "r" : "l",
    h: r.height,
    moved: false,
    vol: v.volume,
    br: bright,
    id: e.pointerId
  };
  try { gest.setPointerCapture(e.pointerId); } catch (x) {}
});
gest.addEventListener("pointermove", function (e) {
  if (!g || e.pointerId !== g.id) return;
  const dy = g.y - e.clientY;
  const dx = e.clientX - g.x;
  if (!g.moved) {
    if (Math.abs(dy) < 12 || Math.abs(dy) < Math.abs(dx)) return;
    g.moved = true;
  }
  const d = dy / (g.h * 0.7);
  if (g.side === "r") setVol(g.vol + d);
  else setBright(g.br + d * 1.5);
});
gest.addEventListener("pointerup", function (e) {
  if (!g) return;
  const gg = g;
  g = null;
  if (gg.moved) return;
  if (Math.abs(e.clientX - gg.x) > 15 || Math.abs(e.clientY - gg.y) > 15) return;
  if (Date.now() - gg.t > 400) return;
  tap();
});
gest.addEventListener("pointercancel", function () { g = null; });

$("#fs").onclick = toggleFull;

// ---------- VLC and copy ----------
function freeConnection() {
  stopTimers();
  killPlayer();
}

function copyText(t, done) {
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { done(true); }, fallback);
  } else {
    fallback();
  }
}

$("#cp").onclick = function () {
  if (!cur || !cur.direct) return;
  freeConnection();
  copyText(cur.direct, function (ok) {
    $("#perr").textContent = ok
      ? "تم نسخ الرابط. في VLC: ملف ثم فتح شبكة ثم الصق الرابط. تم إيقاف المشغل هنا لتفريغ الاتصال. اضغط ▶ للعودة."
      : "تعذر النسخ تلقائياً. جرّب زر VLC";
  });
};

$("#vlc").onclick = function () {
  if (!cur || !cur.direct) return;
  const u = cur.direct;
  const ua = navigator.userAgent || "";
  const ios = ua.indexOf("iPhone") > -1 || ua.indexOf("iPad") > -1 || (ua.indexOf("Macintosh") > -1 && navigator.maxTouchPoints > 1);
  const android = ua.indexOf("Android") > -1;
  freeConnection();
  if (ios) {
    $("#perr").textContent = "جاري فتح VLC... إن لم يفتح فتأكد أنه مثبت أو استخدم نسخ الرابط. اضغط ▶ للعودة.";
    window.location.href = "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(u);
  } else if (android) {
    const scheme = u.indexOf("https") === 0 ? "https" : "http";
    const rest = u.slice(u.indexOf("://") + 3);
    $("#perr").textContent = "جاري فتح VLC... إن لم يفتح فتأكد أنه مثبت أو استخدم نسخ الرابط. اضغط ▶ للعودة.";
    window.location.href = "intent://" + rest + "#Intent;scheme=" + scheme + ";package=org.videolan.vlc;type=video/*;end";
  } else {
    copyText(u, function (ok) {
      $("#perr").textContent = ok
        ? "تم نسخ الرابط. في VLC: ملف ثم فتح شبكة ثم الصق الرابط. اضغط ▶ للعودة."
        : "تعذر النسخ تلقائياً";
    });
  }
};

$("#pclose").onclick = closePlayer;

loadLast();
</script>
